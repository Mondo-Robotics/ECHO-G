[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-g"
version = "0.2.0.dev0"
description = "ECHO-G speech-grounded robot motion with global/local word-time attention"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
  { name = "SOAR-LAB, Nanjing University" },
  { name = "Mondo Robotics" },
]
keywords = [
  "co-speech gesture",
  "diffusion transformer",
  "flow matching",
  "humanoid robotics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
preprocess = [
  "torch>=2.4",
  "scipy==1.15.3",
  "soundfile==0.13.1",
  "librosa==0.11.0",
  "transformers==5.2.0",
]
benchmark = [
  "scipy==1.15.3",
  "librosa==0.11.0",
  "soundfile==0.13.1",
]
visualization = [
  "mujoco==3.10.0",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
echo-g-train = "echo_g.training:main"
echo-g-sample = "echo_g.inference:main"
echo-g-infer = "echo_g.inference:infer_main"
echo-g-eval = "echo_g.evaluation.g1_motion_cls:main"
echo-g-export-mujoco = "echo_g.visualization.export:main"
echo-g-render = "echo_g.visualization.render:main"
echo-g-extract-conditions = "echo_g.conditions:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
